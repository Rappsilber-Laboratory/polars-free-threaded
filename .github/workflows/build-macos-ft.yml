name: Build Multi-Platform Free-Threaded


on:
  push:
    branches:
      - test-free-threaded
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            py-polars/runtime/polars-runtime-32
        
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/Cargo.toml"
        
      - name: Install Python 3.13t and 3.14t
        run: |
          uv python install 3.13t
          uv python install 3.14t
        
      - name: Build wheels
        run: |
          # Patch Cargo.toml to remove abi3 feature (cross-platform)
          uv run python -c "
          import os
          path = 'py-polars/runtime/polars-runtime-32/Cargo.toml'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('\"abi3-py39\", ', '')
          with open(path, 'w') as f:
              f.write(content)
          "
          
          # Build 3.13t
          uv run --python 3.13t --with maturin maturin build -m py-polars/runtime/polars-runtime-32/Cargo.toml --release --compatibility pypi
          
          # Build 3.14t
          uv run --python 3.14t --with maturin maturin build -m py-polars/runtime/polars-runtime-32/Cargo.toml --release --compatibility pypi
          
      - name: Extract version
        id: extract_version
        run: |
          VERSION=$(grep '^version =' py-polars/runtime/polars-runtime-32/Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload wheels to artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl

  release:
    name: Create GitHub Release
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Create or Update Release
        uses: softprop/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-wheels.outputs.version }}-ft"
          name: "Polars Free-Threaded v${{ needs.build-wheels.outputs.version }}"
          files: wheels/*.whl
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
