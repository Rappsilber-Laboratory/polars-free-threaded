name: Build Multi-Platform Free-Threaded


on:
  push:
    branches:
      - test-free-threaded
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        #os: [macos-latest, ubuntu-latest, windows-latest]
        os: [macos-latest]
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            py-polars/runtime/polars-runtime-32
        
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/Cargo.toml"
        
      - name: Install Python 3.13t and 3.14t
        run: |
          uv python install 3.13t
          uv python install 3.14t
        
      - name: Build wheels
        run: |
          # Patch all Cargo.toml files to remove abi3 feature and add free-threaded support safely
          # We use python to safely handle the string replacements ONLY for pyo3
          uv run python -c "
          import os, re
          for root, dirs, files in os.walk('.'):
              if 'target' in dirs: dirs.remove('target')
              for file in files:
                  if file == 'Cargo.toml':
                      path = os.path.join(root, file)
                      with open(path, 'r') as f:
                          lines = f.readlines()
                      
                      new_lines = []
                      changed = False
                      for line in lines:
                          new_line = line
                          # Strip abi3
                          if '\"abi3-py39\"' in new_line:
                              new_line = new_line.replace('\"abi3-py39\", ', '').replace('\"abi3-py39\"', '')
                              changed = True
                          
                          # Add free-threaded specifically to pyo3
                          # We look for lines that define pyo3 dependency
                          if 'pyo3' in new_line and ('workspace = true' in new_line or 'version =' in new_line):
                              if '\"free-threaded\"' not in new_line:
                                  if 'features = [' in new_line:
                                      new_line = new_line.replace('features = [', 'features = [\"free-threaded\", ')
                                  elif 'workspace = true' in new_line:
                                      new_line = new_line.replace('workspace = true', 'workspace = true, features = [\"free-threaded\"]')
                                  changed = True
                          new_lines.append(new_line)
                      
                      if changed:
                          with open(path, 'w') as f:
                              f.writelines(new_lines)
          "
          
          # Special case: ensuring root Cargo.toml has free-threaded in its workspace deps
          uv run python -c "
          path = 'Cargo.toml'
          with open(path, 'r') as f:
              lines = f.readlines()
          with open(path, 'w') as f:
              for line in lines:
                  if 'pyo3 = ' in line and '\"0.26\"' in line:
                      f.write('pyo3 = { version = \"0.26\", features = [\"free-threaded\"] }\n')
                  else:
                      f.write(line)
          "
          
          # Build 3.13t
          uv run --python 3.13t --with maturin maturin build -m py-polars/runtime/polars-runtime-32/Cargo.toml --release --compatibility pypi
          
          # Build 3.14t
          uv run --python 3.14t --with maturin maturin build -m py-polars/runtime/polars-runtime-32/Cargo.toml --release --compatibility pypi
          
      - name: Extract version
        id: extract_version
        run: |
          VERSION=$(grep '^version =' py-polars/runtime/polars-runtime-32/Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload wheels to artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl

  release:
    name: Create GitHub Release
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Create or Update Release
        uses: softprop/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-wheels.outputs.version }}-ft"
          name: "Polars Free-Threaded v${{ needs.build-wheels.outputs.version }}"
          files: wheels/*.whl
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
